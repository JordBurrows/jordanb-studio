<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jordanb.studio // Nav Test</title>
  <style>
    :root {
      --nav-glow: #00f3ff; /* Default Neon Cyan */
    }

    body {
      background-color: #0a0a0c;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 3000px; /* Gives you room to move */
    }

    /* Fixed Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--nav-glow);
      box-shadow: 0 0 15px var(--nav-glow);
      transition: all 0.4s ease;
      z-index: 100;
      box-sizing: border-box;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--nav-glow);
    }

    /* Test Trigger Zones on Screen */
    .zone-container {
      margin-top: 150px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }

    .color-trigger {
      width: 80%;
      max-width: 500px;
      padding: 40px;
      border: 1px dashed #333;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .color-trigger:hover {
      border-color: #fff;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="logo">JORDANB.STUDIO</div>
    <div>[ WORK ] [ ABOUT ] [ VIBE ]</div>
  </nav>

  <div class="zone-container">
    <p>Hover over these blocks to watch the CSS custom variables mutate instantly:</p>
    
    <div class="color-trigger" data-color="#00ff66">
      <h3>🟢 Project 01 Zone</h3>
      <p>(Matrix Green Storefront)</p>
    </div>

    <div class="color-trigger" data-color="#ff5500">
      <h3>🟠 Project 02 Zone</h3>
      <p>(Outrun Orange Sandbox)</p>
    </div>

    <div class="color-trigger" data-color="#ff007f">
      <h3>💗 Project 03 Zone</h3>
      <p>(Vibrant Dissertation Mesh)</p>
    </div>
  </div>

  <script>
    const triggers = document.querySelectorAll('.color-trigger');
    const root = document.documentElement;

    // Dynamically change the global CSS variable on hover
    triggers.forEach(trigger => {
      trigger.addEventListener('mouseenter', () => {
        const targetColor = trigger.getAttribute('data-color');
        root.style.setProperty('--nav-glow', targetColor);
      });

      // Reset back to default cyan when leaving the blocks
      trigger.addEventListener('mouseleave', () => {
        root.style.setProperty('--nav-glow', '#00f3ff');
      });
    });
  </script>

</body>
</html>
