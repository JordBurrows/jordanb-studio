<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work | jordan.b studio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/work.css" />
</head>

<body>
  <nav class="navbar" aria-label="Main navigation">
    <div class="nav-links">
      <a href="home.html" class="nav-item">Jordan.b studio</a>
      <a href="work.html" class="nav-item active">Work</a>
      <a href="about.html" class="nav-item">About</a>
      <a href="contact.html" class="nav-item">Contact</a>
    </div>
  </nav>

  <main class="work-container">
    <div class="gallery-header">
      <div class="title-group">
        <h1 class="gallery-title">Selected work</h1>
        <p class="gallery-subtitle">A curated collection of identity, print, and digital work.</p>
      </div>
    </div>

    <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
  </main>

  <div id="project-detail-overlay" class="project-detail-overlay" aria-hidden="true">
    <div class="project-detail-panel" role="dialog" aria-modal="true" aria-labelledby="project-detail-title">
      <button type="button" class="project-detail-close" id="project-detail-close" aria-label="Close project details">×</button>
      <div class="project-detail-content">
        <p id="project-detail-tag" class="project-detail-tag"></p>
        <h2 id="project-detail-title"></h2>
        <p id="project-detail-desc" class="project-detail-desc"></p>
        <div id="project-detail-gallery" class="project-detail-gallery"></div>
        <div id="project-detail-link" class="project-detail-link-wrap"></div>
      </div>
    </div>
  </div>

  <script src="js/work.js"></script>

  
</body>
</html>
