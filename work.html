<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work | jordan.b studio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav class="navbar" aria-label="Main navigation">
    <div class="nav-links">
      <a href="home.html" class="nav-item">Jordan.b studio</a>
      <a href="work.html" class="nav-item active">Work</a>
      <a href="about.html" class="nav-item">About</a>
      <a href="contact.html" class="nav-item">Contact</a>
    </div>
  </nav>

  <main class="work-container">
    <div class="gallery-header">
      <div class="title-group">
        <h1 class="gallery-title">All work</h1>

        <div class="filter-wrapper">
          <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>

          <select id="category-filter" class="filter-select" aria-label="Filter work by category">
            <option value="all">All work</option>
            <option value="logos">Logos</option>
            <option value="brand">Brand outlets</option>
            <option value="media">Media / artwork / print</option>
            <option value="ui">Website UI</option>
          </select>
        </div>
      </div>
    </div>

    <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
  </main>

  <div id="work-modal-overlay" class="work-modal-overlay" aria-hidden="true">
    <div class="work-modal" role="dialog" aria-modal="true" aria-labelledby="work-modal-title">
      <button type="button" class="work-modal-close" id="work-modal-close" aria-label="Close project details">×</button>
      <span id="work-modal-tag" class="work-modal-tag"></span>
      <h2 id="work-modal-title"></h2>
      <p id="work-modal-desc" class="work-modal-desc"></p>
      <div id="work-modal-gallery" class="work-modal-gallery"></div>
      <div id="work-modal-link" class="work-modal-link-wrap"></div>
    </div>
  </div>

  <script src="js/work.js"></script>
</body>
</html>
